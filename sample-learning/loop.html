<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Looping</title>
</head>
<body>
    <p id="demo"></p>
    <script>
        let p = document.getElementById('demo');
        for(let i = 5; i >= 1; i--) {
            for(let j = 1; j <= i; j++) {
                p.innerHTML += j
            }
            p.innerHTML += "<br>"
        }
    </script>
</body>
</html>
